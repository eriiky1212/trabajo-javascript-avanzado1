<body>

<header class="topbar">

<main class="container">

  <section class="panel">
    <h1>Galería dinámica</h1>
    <p class="small">Carrusel con botones, indicadores y teclado (← →).</p>
      <div class="carousel">
  
  <button class="btn btn-prev" type="button" aria-label="Anterior">‹</button>

  <figure class="carousel-frame">
    <img id="carouselImg" src="../assets/img/galeria1.jpg" alt="Imagen 1 de la galería">

  </figure>

  <button class="btn btn-next" type="button" aria-label="Siguiente">›</button>

</div>

<div class="dots" id="carouselDots"></div>

  </section>

</main>

    </p>
  </div>
</footer>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const prev = document.querySelector(".btn-prev");
    const next = document.querySelector(".btn-next");
    console.log("Test botones:", { prev: !!prev, next: !!next });

    prev?.addEventListener("click", () => console.log("CLICK prev ✅"));
    next?.addEventListener("click", () => console.log("CLICK next ✅"));
  });
</script>
